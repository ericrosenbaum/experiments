<!DOCTYPE html>
<html lang="en" data-skin="riso">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oh My Eyes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Abril+Fatface&family=Karla:wght@400;500;700&family=Zilla+Slab:wght@600;700&family=Libre+Franklin:wght@400;500;600&family=Rubik+Mono+One&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    --bg: #1c4fd8;
    --bg-deep: #163fb0;
    --ink: #10203f;
    --paper: #fffdf6;
    --paper-shade: #ece5d2;
    --die: #ffd23f;
    --die-edge: #d9a900;
    --die-ink: #1b1400;
    --on-bg: #ffffff;
    --on-bg-soft: rgba(255,255,255,.72);
    --on-bg-faint: rgba(255,255,255,.28);
    --btn: #ffffff;
    --btn-ink: #1c4fd8;
    --btn-ghost: rgba(255,255,255,.14);
    --focus: #ffd23f;
    --timer: #ff6b4a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f2a6e; --bg-deep: #0a1f54; --paper: #fbf7ea; --paper-shade: #ddd4bd;
      --btn: #fbf7ea; --btn-ink: #0f2a6e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f2a6e; --bg-deep: #0a1f54; --paper: #fbf7ea; --paper-shade: #ddd4bd;
    --btn: #fbf7ea; --btn-ink: #0f2a6e;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%;
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    background-image: radial-gradient(ellipse at 50% 120%, var(--bg-deep), transparent 70%);
    color: var(--on-bg);
    font-family: "Fredoka", "Nunito", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button:disabled { cursor: default; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 24px 0;
  }
  h1 {
    margin: 0; font-weight: 700; font-size: clamp(22px, 3vw, 34px); letter-spacing: -0.01em; line-height: 1;
  }
  .meta { display: flex; align-items: center; gap: 14px; color: var(--on-bg-soft); font-size: 15px; }
  .round { font-weight: 600; color: var(--on-bg); }
  .round small { color: var(--on-bg-soft); font-weight: 500; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 999px; background: var(--btn-ghost);
    display: grid; place-items: center; color: var(--on-bg);
  }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: center; gap: clamp(20px, 4vw, 64px);
    padding: 10px clamp(20px, 6vw, 96px) 24px;
    max-width: 1280px; width: 100%; margin: 0 auto;
  }

  /* The card */
  main { grid-template-rows: minmax(0, 1fr); }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; height: 100%; min-height: 0; }
  /* The slot takes the space the layout leaves; the card is the largest 4:5 that fits in it. */
  .card-slot { flex: 0 1 550px; min-height: 0; width: 100%; container-type: size; display: grid; place-items: center; }
  .card {
    position: relative; width: min(100cqw, 80cqh, 440px); aspect-ratio: 4 / 5;
    background: var(--paper); border-radius: 22px; color: var(--ink);
    box-shadow: 0 2px 0 var(--paper-shade), 0 22px 40px -18px rgba(0,0,0,.55);
    display: grid; overflow: hidden;
    transform-origin: 50% 60%;
  }
  .card::after {
    content: ""; position: absolute; inset: 12px; border-radius: 13px;
    border: 2px solid var(--paper-shade); pointer-events: none;
  }
  .card { grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
  .card .art { display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; padding: 34px; min-height: 0; height: 100%; box-sizing: border-box; }
  .card img { width: 72%; height: 74%; object-fit: contain; image-rendering: auto;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.08)); }
  .card .empty { color: var(--paper-shade); font-size: 120px; font-weight: 700; line-height: 1; user-select: none; }
  .card.deal { animation: deal .48s cubic-bezier(.2,.9,.3,1.15) both; }
  @keyframes deal {
    from { transform: translateY(26px) rotate(-5deg) scale(.92); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* The dice */
  .table { display: flex; flex-direction: column; align-items: center; gap: 28px; }
  .dice { display: flex; gap: clamp(8px, 1.4vw, 16px); justify-content: center; align-items: center; min-height: 128px; width: 100%; --die-size: 116px; }
  .dice[data-count="4"] { --die-size: 104px; } .dice[data-count="5"] { --die-size: 88px; }
  @media (max-width: 560px) { .dice { --die-size: 76px; } .dice[data-count="4"] { --die-size: 68px; } .dice[data-count="5"] { --die-size: 56px; } }
  .die {
    width: var(--die-size); aspect-ratio: 1; border-radius: 22%;
    display: grid; place-items: center;
    font-size: calc(var(--die-size) * .6); font-weight: 700; line-height: 1;
    background: var(--die); color: var(--die-ink);
    box-shadow: inset 0 -6px 0 var(--die-edge), 0 14px 22px -12px rgba(0,0,0,.6);
    transition: transform .2s;
  }
  .die.slot { background: transparent; box-shadow: none; border: 3px dashed var(--on-bg-faint); }
  .die.rolling { animation: tumble .12s linear infinite; }
  .die.land { animation: land .4s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes tumble {
    0% { transform: rotate(-6deg) translateY(-6px); } 50% { transform: rotate(5deg) translateY(4px); } 100% { transform: rotate(-6deg) translateY(-6px); }
  }
  @keyframes land { from { transform: scale(1.18) rotate(-4deg); } to { transform: none; } }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .btn {
    padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 19px;
    background: var(--btn); color: var(--btn-ink);
    box-shadow: 0 3px 0 rgba(0,0,0,.28); transition: transform .12s, box-shadow .12s, opacity .15s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
  .btn:disabled { opacity: .35; box-shadow: none; }
  .btn.primary { font-size: 22px; padding: 16px 32px; }
  .btn.ghost { background: var(--btn-ghost); color: var(--on-bg); box-shadow: none; }
  .btn .key {
    display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; margin-left: 8px;
    border-radius: 7px; background: rgba(0,0,0,.12); font-size: 13px; font-weight: 700; vertical-align: 2px;
  }
  .btn.ghost .key { background: rgba(255,255,255,.18); }

  .timer { display: flex; align-items: center; gap: 12px; color: var(--on-bg-soft); font-size: 17px; min-height: 44px; }
  .timer .ring { width: 44px; height: 44px; }
  .timer .ring circle { fill: none; stroke-width: 5; }
  .timer .ring .track { stroke: var(--on-bg-faint); }
  .timer .ring .fill { stroke: var(--die); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .9s linear, stroke .3s; }
  .timer.urgent .ring .fill { stroke: var(--timer); }
  .timer .count { font-weight: 600; font-size: 22px; color: var(--on-bg); min-width: 2.4ch; font-variant-numeric: tabular-nums; }
  .timer.done .count { color: var(--timer); }
  .timer .btn { padding: 8px 14px; font-size: 15px; }

  .hint { text-align: center; color: var(--on-bg-soft); font-size: 15px; max-width: 42ch; line-height: 1.45; margin: 0; }

  /* Keyboard shortcut badges mean nothing on a touch screen */
  @media (hover: none) and (pointer: coarse) { .btn .key { display: none; } }

  /* Portrait / narrow: one column that fits the screen without scrolling.
     The sections dissolve into one grid so Next card and Roll share a row. */
  @media (max-width: 760px), (max-aspect-ratio: 1/1) {
    header { padding: 12px 16px 0; }
    main {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(0, 1fr) auto auto auto auto;
      grid-template-areas: "card card" "dice dice" "draw roll" "timer timer" "hint hint";
      align-items: center; gap: 14px 10px; padding: 10px 16px 14px;
    }
    .stage, .table { display: contents; }
    .card-slot { grid-area: card; height: 100%; }
    .dice { grid-area: dice; min-height: 0;
      --die-size: min(84px, 21vw, 10.5dvh); }
    .dice[data-count="4"] { --die-size: min(76px, 18vw, 10dvh); }
    .dice[data-count="5"] { --die-size: min(64px, 15vw, 9dvh); }
    .stage .controls { grid-area: draw; }
    .table .controls { grid-area: roll; }
    .controls .btn, .controls .btn.primary { width: 100%; font-size: 18px; padding: 13px 10px; }
    .timer { grid-area: timer; justify-self: center; min-height: 0; }
    .timer .ring { width: 36px; height: 36px; }
    .hint { grid-area: hint; justify-self: center; font-size: 14px; line-height: 1.35; }
  }
  @media ((max-width: 760px) or (max-aspect-ratio: 1/1)) and (max-height: 640px) {
    main { gap: 10px 10px; padding-bottom: 10px; }
    .hint { display: none; }
  }

  /* Landscape phones: keep the two columns, tighten everything vertically */
  @media (min-width: 761px) and (min-aspect-ratio: 1/1) and (max-height: 560px) {
    header { padding: 10px 20px 0; }
    main { padding-top: 8px; padding-bottom: 12px; }
    .stage { gap: 10px; }
    .table { gap: 12px; }
    .dice { min-height: 0; --die-size: min(116px, 22dvh); }
    .dice[data-count="4"] { --die-size: min(104px, 20dvh); }
    .dice[data-count="5"] { --die-size: min(88px, 18dvh); }
    .btn.primary { font-size: 19px; padding: 12px 24px; }
    .btn { padding: 11px 20px; }
    .hint { display: none; }
  }

  /* Settings */
  dialog {
    border: 0; border-radius: 18px; padding: 24px 26px; width: min(92vw, 380px);
    background: var(--paper); color: var(--ink); font: inherit;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  dialog::backdrop { background: rgba(6, 14, 40, .55); }
  dialog h2 { margin: 0 0 18px; font-size: 22px; font-weight: 700; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--paper-shade); }
  .field:first-of-type { border-top: 0; }
  .field label { font-weight: 500; }
  .field small { display: block; color: #667; font-weight: 400; font-size: 13px; margin-top: 2px; }
  select { font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--paper-shade); background: #fff; color: var(--ink); }
  .switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: #c9c2ad; transition: background .2s; flex: none; }
  .switch[aria-checked="true"] { background: var(--bg); }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  dialog .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 13px; color: #667; }
  dialog .foot a { color: inherit; }
  dialog .foot .btn { font-size: 15px; padding: 9px 18px; background: var(--bg); color: #fff; }

  /* ---------- Themes ---------- */
  h1 { font-family: var(--font-display, inherit); }
  body { font-family: var(--font-body, "Fredoka", "Nunito", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif); }
  .timer .ring .fill { stroke: var(--ring, var(--die)); }
  dialog .foot .btn { background: var(--btn-strong, var(--bg)); color: var(--btn-strong-ink, #fff); }
  h1 .t { display: inline-block; }

  /* Card Table: green baize, red casino dice, brass trim */
  :root[data-skin="felt"] {
    --bg: #1d5c3f; --bg-deep: #123d29; --ink: #1d2a22;
    --paper: #fbf8ef; --paper-shade: #c9a45c;
    --die: #c4122f; --die-edge: #8a0b20; --die-ink: #fff6e5;
    --on-bg: #f6ecd2; --on-bg-soft: rgba(246,236,210,.72); --on-bg-faint: rgba(246,236,210,.26);
    --btn: #f6ecd2; --btn-ink: #123d29; --btn-ghost: rgba(0,0,0,.22);
    --focus: #e3c07a; --timer: #ff7b5c; --ring: #e3c07a;
    --btn-strong: #1d5c3f;
    --font-display: "Abril Fatface", "Didot", Georgia, serif;
    --font-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-skin="felt"] body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(0,0,0,.45) 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.035) 0 2px, transparent 2px 4px);
  }
  :root[data-skin="felt"] h1 { font-weight: 400; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .01em; color: #e3c07a; }
  :root[data-skin="felt"] .card { border-radius: 16px; box-shadow: 0 1px 0 #d8d0bc, 0 26px 40px -16px rgba(0,0,0,.7); }
  :root[data-skin="felt"] .card::after { inset: 14px; border: 2px solid var(--paper-shade); border-radius: 8px;
    box-shadow: inset 0 0 0 5px var(--paper), inset 0 0 0 6px var(--paper-shade); }
  :root[data-skin="felt"] .die { border-radius: 16%; font-family: var(--font-display); font-weight: 400;
    background: linear-gradient(155deg, #d8243f, #b10f29 60%); box-shadow: inset 0 -5px 0 var(--die-edge), inset 0 2px 0 rgba(255,255,255,.18), 0 14px 18px -10px rgba(0,0,0,.75); }
  :root[data-skin="felt"] .die.slot { border-color: rgba(227,192,122,.35); background: rgba(0,0,0,.12); box-shadow: none; }
  :root[data-skin="felt"] .btn { font-weight: 700; letter-spacing: .01em; }

  /* Eye Chart: the optometrist's wall, letters shrinking row by row */
  :root[data-skin="chart"] {
    --bg: #f3f4f1; --bg-deep: #f3f4f1; --ink: #000;
    --paper: #fff; --paper-shade: #d6d8d2;
    --die: transparent; --die-edge: transparent; --die-ink: #000;
    --on-bg: #000; --on-bg-soft: #55584f; --on-bg-faint: #c3c6bd;
    --btn: #c8102e; --btn-ink: #fff; --btn-ghost: #e2e4de;
    --focus: #1a7f5a; --timer: #c8102e; --ring: #1a7f5a;
    --btn-strong: #000;
    --font-display: "Zilla Slab", Rockwell, "Courier New", serif;
    --font-body: "Libre Franklin", "Franklin Gothic Medium", Arial, sans-serif;
  }
  :root[data-skin="chart"] body { background: var(--bg); }
  :root[data-skin="chart"] h1 { font-weight: 700; letter-spacing: .16em; display: flex; align-items: baseline; gap: .1em; }
  :root[data-skin="chart"] h1 .t:nth-child(1) { font-size: 1.25em; }
  :root[data-skin="chart"] h1 .t:nth-child(2) { font-size: .95em; }
  :root[data-skin="chart"] h1 .t:nth-child(3) { font-size: .7em; }
  :root[data-skin="chart"] .card { border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 18px 34px -22px rgba(0,0,0,.35); }
  :root[data-skin="chart"] .card::after { inset: 0; border-radius: 3px; border: 0; border-bottom: 10px solid #c8102e;
    box-shadow: inset 0 -20px 0 #fff, inset 0 -30px 0 #1a7f5a; }
  :root[data-skin="chart"] .dice { gap: clamp(14px, 2.4vw, 30px); align-items: baseline; }
  :root[data-skin="chart"] .die { box-shadow: none; border-radius: 0; font-family: var(--font-display); font-weight: 700; font-size: calc(var(--die-size) * .95); }
  :root[data-skin="chart"] .die:nth-child(2) { font-size: calc(var(--die-size) * .8); }
  :root[data-skin="chart"] .die:nth-child(3) { font-size: calc(var(--die-size) * .66); }
  :root[data-skin="chart"] .die:nth-child(4) { font-size: calc(var(--die-size) * .54); }
  :root[data-skin="chart"] .die:nth-child(5) { font-size: calc(var(--die-size) * .44); }
  :root[data-skin="chart"] .die.slot { border: 0; border-bottom: 3px solid var(--on-bg-faint); height: 0; align-self: center; }
  :root[data-skin="chart"] .btn { border-radius: 4px; box-shadow: none; font-weight: 600; }
  :root[data-skin="chart"] .btn.ghost { background: transparent; color: #000; box-shadow: inset 0 0 0 2px #000; }
  :root[data-skin="chart"] .btn .key { background: rgba(255,255,255,.22); }
  :root[data-skin="chart"] .btn.ghost .key { background: #e2e4de; }
  :root[data-skin="chart"] #drawBtn { background: #000; color: #fff; }
  :root[data-skin="chart"] .icon-btn { color: #000; }

  /* Riso Zine: fluorescent pink and blue ink on yellow stock, slightly misregistered */
  :root[data-skin="riso"] {
    --bg: #ffe14d; --bg-deep: #ffe14d; --ink: #0b4fa8;
    --paper: #fffdf7; --paper-shade: #0b4fa8;
    --die: #ff4fa3; --die-edge: #ff4fa3; --die-ink: #fffdf7;
    --on-bg: #0b4fa8; --on-bg-soft: #3a5f9a; --on-bg-faint: rgba(11,79,168,.35);
    --btn: #0b4fa8; --btn-ink: #fffdf7; --btn-ghost: rgba(11,79,168,.12);
    --focus: #ff4fa3; --timer: #ff4fa3; --ring: #0b4fa8;
    --btn-strong: #0b4fa8;
    --font-display: "Rubik Mono One", "Arial Black", sans-serif;
    --font-body: "Rubik", "Trebuchet MS", sans-serif;
  }
  :root[data-skin="riso"] body {
    background-color: var(--bg);
    background-image: radial-gradient(rgba(11,79,168,.13) 1px, transparent 1.4px);
    background-size: 7px 7px;
  }
  :root[data-skin="riso"] h1 { font-weight: 400; color: #ff4fa3; text-shadow: 3px 2px 0 #0b4fa8; letter-spacing: -.01em; }
  :root[data-skin="riso"] .card { border-radius: 6px; transform: rotate(-1.2deg); box-shadow: 10px 9px 0 #ff4fa3; }
  :root[data-skin="riso"] .card.deal { animation-name: deal-riso; }
  @keyframes deal-riso { from { transform: translateY(26px) rotate(-7deg) scale(.92); opacity: 0; } to { transform: rotate(-1.2deg); opacity: 1; } }
  :root[data-skin="riso"] .card::after { border: 2px dashed rgba(11,79,168,.4); border-radius: 3px; }
  :root[data-skin="riso"] .die { border-radius: 50%; font-family: var(--font-display); font-weight: 400; font-size: calc(var(--die-size) * .5);
    box-shadow: 5px 4px 0 #0b4fa8; text-shadow: 2px 2px 0 #0b4fa8; }
  :root[data-skin="riso"] .die:nth-child(even) { transform: rotate(4deg); }
  :root[data-skin="riso"] .die:nth-child(odd) { transform: rotate(-3deg); }
  :root[data-skin="riso"] .die.slot { border: 3px dashed var(--on-bg-faint); background: transparent; box-shadow: none; }
  :root[data-skin="riso"] .btn { border-radius: 6px; box-shadow: 4px 4px 0 #ff4fa3; font-weight: 600; }
  :root[data-skin="riso"] .btn:active { box-shadow: 1px 1px 0 #ff4fa3; transform: translate(3px, 3px); }
  :root[data-skin="riso"] .btn.ghost { box-shadow: inset 0 0 0 2px #0b4fa8; color: #0b4fa8; }
  :root[data-skin="riso"] .btn .key { background: rgba(255,255,255,.2); }
  :root[data-skin="riso"] .btn.ghost .key { background: rgba(11,79,168,.12); }
  :root[data-skin="riso"] .icon-btn { color: #0b4fa8; }
  :root[data-skin="riso"] dialog { border-radius: 6px; box-shadow: 10px 10px 0 #ff4fa3; }

  @media (prefers-reduced-motion: reduce) {
    .card.deal, .die.rolling, .die.land { animation: none; }
    .btn, .die { transition: none; }
  }
</style>
</head>
<body>
<header>
  <h1 aria-label="Oh My Eyes"><span class="t" aria-hidden="true">Oh</span>&nbsp;<span class="t" aria-hidden="true">My</span>&nbsp;<span class="t" aria-hidden="true">Eyes</span></h1>
  <div class="meta">
    <div class="round" id="round"><small>Round</small> 0</div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">

<main>
  <section class="stage">
    <div class="card-slot">
      <div class="card" id="card">
        <div class="art" id="art"><div class="empty">?</div></div>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="drawBtn">Draw a card <span class="key">D</span></button>
    </div>
  </section>

  <section class="table">
    <div class="dice" id="dice" aria-label="Letter dice">
    </div>
    <div class="controls">
      <button class="btn" id="rollBtn" disabled>Roll <span id="rollCount">3</span> dice <span class="key">R</span></button>
    </div>
    <div class="timer" id="timer">
      <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
        <circle class="track" cx="22" cy="22" r="19"/>
        <circle class="fill" id="ringFill" cx="22" cy="22" r="19"/>
      </svg>
      <span class="count" id="count">60</span>
      <button class="btn ghost" id="timerBtn" disabled>Start timer <span class="key">Space</span></button>
    </div>
    <p class="hint" id="hint" aria-live="polite">Draw a card, then roll the letter dice. Describe the picture with a phrase whose words start with those letters, in any order.</p>
  </section>
</main>

<dialog id="settings">
  <h2>Settings</h2>
  <div class="field">
    <label for="skin">Theme</label>
    <select id="skin">
      <option value="riso">Riso Zine</option>
      <option value="classic">Game Night</option>
      <option value="felt">Card Table</option>
      <option value="chart">Eye Chart</option>
    </select>
  </div>
  <div class="field">
    <label for="weighting">Letter odds<small>How the dice are weighted</small></label>
    <select id="weighting">
      <option value="text">First letters in running text</option>
      <option value="dict">First letters of dictionary words</option>
      <option value="flat">Every letter equal</option>
    </select>
  </div>
  <div class="field">
    <label for="diceCount">Number of dice<small>More dice, longer phrase</small></label>
    <select id="diceCount">
      <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option>
    </select>
  </div>
  <div class="field">
    <label for="timerLen">Timer</label>
    <select id="timerLen">
      <option value="30">30 seconds</option>
      <option value="45">45 seconds</option>
      <option value="60" selected>60 seconds</option>
      <option value="90">90 seconds</option>
      <option value="0">Off</option>
    </select>
  </div>
  <div class="field">
    <label>Deck<small id="deckInfo"></small></label>
    <button class="btn ghost" id="reshuffle" style="color: var(--ink); background: rgba(0,0,0,.07); box-shadow:none; font-size:15px; padding:8px 14px;">Reshuffle</button>
  </div>
  <div class="foot">
    <span>Art: <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a>, CC0</span>
    <button class="btn" id="closeSettings">Done</button>
  </div>
</dialog>

const SKINS = ["classic", "felt", "chart", "riso"];
function applySkin() { document.documentElement.dataset.skin = state.skin; }
const state = {
  order: [], pos: 0, round: 0, card: null, letters: [], rolling: false,
  skin: "riso", skinChosen: false, weighting: "text", diceCount: 3, timerLen: 60, timerLeft: 0, timerId: null

const $ = id => document.getElementById(id);

// Per-viewer conveniences only; the page works fine if storage is empty.
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem("ohmyeyes:prefs") || "{}");
    if (WEIGHTS[p.weighting]) state.weighting = p.weighting;
    if (p.skinChosen && SKINS.includes(p.skin)) { state.skin = p.skin; state.skinChosen = true; }
    if ([1,2,3,4,5].includes(p.diceCount)) state.diceCount = p.diceCount;
    if ([0,30,45,60,90].includes(p.timerLen)) state.timerLen = p.timerLen;
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem("ohmyeyes:prefs", JSON.stringify({ skin: state.skin, skinChosen: state.skinChosen, weighting: state.weighting, diceCount: state.diceCount, timerLen: state.timerLen })); } catch (e) {}
}

function shuffle() {
  state.order = DECK.map((_, i) => i);
  for (let i = state.order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
  }
  state.pos = 0;
  updateDeckInfo();
}
function updateDeckInfo() {
  $("deckInfo").textContent = `${DECK.length - state.pos} of ${DECK.length} cards left`;
}

function weightedLetter() {
  const w = WEIGHTS[state.weighting];
  const total = Object.values(w).reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (const [c, p] of Object.entries(w)) { r -= p; if (r < 0) return c.toUpperCase(); }
  return "T";
}

function draw() {
  if (state.rolling) return;
  if (state.pos >= state.order.length) shuffle();
  const item = DECK[state.order[state.pos++]];
  state.card = item; state.round++; state.letters = [];
  $("round").innerHTML = `<small>Round</small> ${state.round}`;
  updateDeckInfo();

  art.innerHTML = "";
  const img = new Image();
  img.src = item.src; img.alt = ""; img.decoding = "async";
  art.appendChild(img);
  card.classList.remove("deal"); void card.offsetWidth; card.classList.add("deal");

  renderDice([]);
  rollBtn.disabled = false;
  drawBtn.textContent = ""; drawBtn.innerHTML = `Next card <span class="key">D</span>`;
  drawBtn.classList.remove("primary");
  resetTimer();
  $("hint").textContent = "Roll the dice. Change how many in settings, or press 1–5.";
}

function renderDice(letters) {
  dice.innerHTML = ""; dice.dataset.count = state.diceCount;
  for (let i = 0; i < state.diceCount; i++) {
    const d = document.createElement("div");
    d.className = "die" + (letters[i] ? "" : " slot");
    d.textContent = letters[i] || "";
    dice.appendChild(d);
  }
}

async function roll() {
  if (!state.card || state.rolling) return;
  const n = state.diceCount;
  state.rolling = true;
  rollBtn.disabled = true;
  drawBtn.disabled = true;
  const final = Array.from({ length: n }, weightedLetter);
  state.letters = final;
  dice.innerHTML = ""; dice.dataset.count = state.diceCount;
  const els = final.map(() => { const d = document.createElement("div"); d.className = "die"; dice.appendChild(d); return d; });
  for (let i = n; i < state.diceCount; i++) { const d = document.createElement("div"); d.className = "die slot"; dice.appendChild(d); }

  if (reduceMotion) {
    els.forEach((d, i) => d.textContent = final[i]);
  } else {
    els.forEach(d => d.classList.add("rolling"));
    const start = performance.now();
    await new Promise(resolve => {
      const tick = now => {
        const t = now - start;
        let allDone = true;
        els.forEach((d, i) => {
          const settleAt = 650 + i * 220;
          if (t < settleAt) { allDone = false; d.textContent = String.fromCharCode(65 + Math.floor(Math.random() * 26)); }
          else if (d.classList.contains("rolling")) { d.classList.remove("rolling"); d.classList.add("land"); d.textContent = final[i]; }
        });
        allDone ? resolve() : requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }
  state.rolling = false;
  rollBtn.disabled = false;
  drawBtn.disabled = false;
  timerBtn.disabled = state.timerLen === 0;
  $("hint").textContent = state.timerLen ? "Describe the picture. Start the timer when everyone's ready." : "Describe the picture using these letters, in any order.";
  if (state.timerLen && !state.timerId) { /* leave it to the host to start */ }
}

// Timer
function resetTimer() {
  clearInterval(state.timerId); state.timerId = null;
  state.timerLeft = state.timerLen;
  timerEl.classList.remove("urgent", "done");
  timerEl.style.visibility = state.timerLen ? "visible" : "hidden";
  countEl.textContent = state.timerLen || "";
  ring.style.strokeDashoffset = 0;
  timerBtn.innerHTML = `Start timer <span class="key">Space</span>`;
  timerBtn.disabled = true;
}
function toggleTimer() {
  if (!state.timerLen || !state.letters.length) return;
  if (state.timerId) { resetTimer(); timerBtn.disabled = false; return; }
  if (state.timerLeft <= 0) state.timerLeft = state.timerLen;
  timerEl.classList.remove("done");
  timerBtn.innerHTML = `Reset <span class="key">Space</span>`;
  const tick = () => {
    state.timerLeft--;
    countEl.textContent = Math.max(0, state.timerLeft);
    ring.style.strokeDashoffset = CIRC * (1 - state.timerLeft / state.timerLen);
    timerEl.classList.toggle("urgent", state.timerLeft <= 10);
    if (state.timerLeft <= 0) {
      clearInterval(state.timerId); state.timerId = null;
      timerEl.classList.add("done");
      timerBtn.innerHTML = `Start again <span class="key">Space</span>`;
    }
  };
  state.timerId = setInterval(tick, 1000);
}

// Wiring
drawBtn.addEventListener("click", draw);
rollBtn.addEventListener("click", roll);
timerBtn.addEventListener("click", toggleTimer);
document.addEventListener("keydown", e => {
  if (e.target.closest("dialog, select, input")) return;
  if (e.key === "d" || e.key === "D") { e.preventDefault(); draw(); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); roll(); }
  else if (["1","2","3","4","5"].includes(e.key)) { e.preventDefault(); setDiceCount(+e.key); }
  else if (e.key === " ") { e.preventDefault(); toggleTimer(); }
});

// Settings
const settings = $("settings"), weightingSel = $("weighting"), timerLenSel = $("timerLen"), diceCountSel = $("diceCount");
function setDiceCount(n) {
  if (state.rolling) return;
  state.diceCount = n; savePrefs();
  $("rollCount").textContent = n;
  rollBtn.lastChild.previousSibling.textContent = n === 1 ? " die " : " dice ";
  diceCountSel.value = String(n);
  if (!state.letters.length || state.letters.length !== n) { state.letters = []; renderDice([]); resetTimer(); }
}
diceCountSel.addEventListener("change", () => setDiceCount(+diceCountSel.value));
const skinSel = $("skin");
skinSel.addEventListener("change", () => { state.skin = skinSel.value; state.skinChosen = true; applySkin(); savePrefs(); });
$("settingsBtn").addEventListener("click", () => {
  skinSel.value = state.skin; weightingSel.value = state.weighting; timerLenSel.value = String(state.timerLen); diceCountSel.value = String(state.diceCount);
  updateDeckInfo();
  settings.showModal();
});
$("closeSettings").addEventListener("click", () => settings.close());
weightingSel.addEventListener("change", () => { state.weighting = weightingSel.value; savePrefs(); });
timerLenSel.addEventListener("change", () => {
  state.timerLen = +timerLenSel.value; savePrefs();
  resetTimer(); if (state.letters.length) timerBtn.disabled = state.timerLen === 0;
});
$("reshuffle").addEventListener("click", () => { shuffle(); settings.close(); });

loadPrefs();
applySkin();
shuffle();
resetTimer();
setDiceCount(state.diceCount);
</script>
</body>
