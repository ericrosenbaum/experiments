# fly launch --copy-config --no-deploy, then:
#   fly secrets set ANTHROPIC_API_KEY=...
#   fly deploy
# Rooms live in this one process's memory, so keep exactly one machine running.
app = "worldchat"
primary_region = "ewr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpus = 1
