# Fly.io app for the sim server. `fly launch --copy-config` then `fly deploy`.
# Rooms live in memory, so one machine that never sleeps: auto_stop is off.
app = "brick-behaviors-sim"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  SANDBOX = "isolate"
  MAX_ROOMS = "20"
  ROOM_IDLE_MS = "600000"
  # The page's origin(s), comma-separated. Leave unset to allow any.
  # ORIGINS = "https://brick-behaviors.vercel.app"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
