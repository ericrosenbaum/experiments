<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowdoodle</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; cursor: pointer; touch-action: none; }
  #msg { position: fixed; inset: auto 0 1.5em; text-align: center; color: #888; font: 14px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">waiting for camera…</div>
<script>
// Glowdoodle: paint with light. Each pixel keeps whichever is brighter, the
// camera or what is already there, and the picture fades very slowly.
// Port of https://www.shadertoy.com/view/wlXcW4

const FADE = 0.999; // per frame

const VERT = `#version 300 es
in vec2 p;
out vec2 uv;
void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0., 1.); }`;

// Shadertoy's Buffer A and Buffer B folded into one pass:
// image = brighter of (mirrored camera, previous image * fade)
const PAINT = `#version 300 es
precision highp float;
uniform sampler2D cam, prev;
uniform float fade; // 0 clears
in vec2 uv;
out vec4 color;
float gray(vec3 rgb) { return dot(rgb, vec3(0.2125, 0.7154, 0.0721)); }
void main() {
  vec3 c = texture(cam, vec2(1. - uv.x, uv.y)).rgb;
  vec3 i = texture(prev, uv).rgb * fade;
  color = vec4(gray(c) > gray(i) ? c : i, 1.);
}`;

const SHOW = `#version 300 es
precision highp float;
uniform sampler2D img;
in vec2 uv;
out vec4 color;
void main() { color = vec4(texture(img, uv).rgb, 1.); }`;

const msg = document.getElementById('msg');
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2');

function program(fragSrc) {
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, fragSrc]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(prog, s);
  }
  gl.bindAttribLocation(prog, 0, 'p');
  gl.linkProgram(prog);
  return prog;
}

function texture(filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

async function start() {
  if (!gl) throw new Error('WebGL2 is not available');

  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
  await video.play();
  const w = canvas.width = video.videoWidth;
  const h = canvas.height = video.videoHeight;

  // The slow fade needs float buffers: at 8 bits, x * 0.999 rounds back to x.
  const float = gl.getExtension('EXT_color_buffer_float');

  const paint = program(PAINT);
  const show = program(SHOW);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const camTex = texture(gl.LINEAR);
  // Two image buffers, ping-ponged: read one, write the other.
  let [read, write] = [0, 1].map(() => {
    const tex = texture(gl.NEAREST);
    if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, w, h, 0, gl.RGBA, gl.FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fbo };
  });

  gl.useProgram(paint);
  gl.uniform1i(gl.getUniformLocation(paint, 'cam'), 0);
  gl.uniform1i(gl.getUniformLocation(paint, 'prev'), 1);
  const fadeLoc = gl.getUniformLocation(paint, 'fade');
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.viewport(0, 0, w, h);

  // Hold to clear
  let clearing = false;
  canvas.addEventListener('pointerdown', () => { clearing = true; });
  addEventListener('pointerup', () => { clearing = false; });
  addEventListener('pointercancel', () => { clearing = false; });

  msg.textContent = 'click to clear';
  setTimeout(() => { msg.textContent = ''; }, 4000);

  function frame() {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, read.tex);

    gl.useProgram(paint);
    gl.uniform1f(fadeLoc, clearing ? 0 : FADE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, write.fbo);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(show); // sampler defaults to unit 0
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, write.tex);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    [read, write] = [write, read];
    requestAnimationFrame(frame);
  }
  frame();
}

start().catch(e => { msg.textContent = e.name === 'NotAllowedError' ? 'Glowdoodle needs camera access' : e.message; });
</script>
</body>
</html>
