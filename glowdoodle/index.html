<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowdoodle</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font: 14px system-ui, sans-serif; color: #ddd; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: cover; cursor: pointer; touch-action: none; }
  #msg { position: fixed; inset: auto 0 1.5em; text-align: center; color: #888; pointer-events: none; }

  /* Controls: white icons on dark chips, so they show on any picture. They dim when the pointer rests. */
  #controls { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; transition: opacity .4s; }
  body.idle #controls { opacity: .3; }
  #controls button { width: 40px; height: 40px; padding: 10px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 50%; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; }
  #controls button:hover, #controls button:focus-visible, #controls button[aria-expanded=true] { background: rgba(0, 0, 0, .85); border-color: rgba(255, 255, 255, .6); }
  #controls svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  #panel { position: fixed; right: 10px; bottom: 58px; width: 220px; max-width: calc(100vw - 20px); box-sizing: border-box; padding: 14px; display: grid; gap: 14px; border: 1px solid rgba(255, 255, 255, .2); border-radius: 10px; background: rgba(20, 20, 20, .9); box-shadow: 0 4px 20px rgba(0, 0, 0, .4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #panel label { display: grid; gap: 6px; }
  #panel label.row { display: flex; align-items: center; justify-content: space-between; }
  #panel input[type=range], #panel select { width: 100%; margin: 0; box-sizing: border-box; accent-color: #fff; }
  #panel input[type=checkbox] { margin: 0; width: 16px; height: 16px; accent-color: #fff; }
  #panel fieldset { margin: 0; padding: 12px 0 0; border: 0; border-top: 1px solid rgba(255, 255, 255, .15); display: grid; gap: 10px; }
  #panel kbd { margin-left: 6px; color: #888; font: inherit; }
  #panel .ends { display: flex; justify-content: space-between; color: #888; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">waiting for camera…</div>

<div id="panel" hidden>
  <label>Fade
    <input id="fade" type="range" min="0" max="1" step="0.01">
    <span class="ends"><span>never</span><span>fast</span></span>
  </label>
  <label class="row">Mirror <input id="mirror" type="checkbox"></label>
  <label id="cameraRow" hidden>Camera <select id="camera"></select></label>
  <fieldset>
    <label class="row"><span>Kaleidoscope<kbd>↑</kbd></span> <input id="kaleido" type="checkbox"></label>
    <label class="row"><span>Zoom<kbd>→</kbd></span> <input id="zoom" type="checkbox"></label>
    <label class="row"><span>Hue shift<kbd>←</kbd></span> <input id="hue" type="checkbox"></label>
    <label class="row"><span>Pause<kbd>↓</kbd></span> <input id="pause" type="checkbox"></label>
  </fieldset>
</div>

<div id="controls">
  <button id="settingsBtn" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="panel">
    <svg viewBox="0 0 20 20"><path d="M3 6h2M9 6h8M3 14h8M15 14h2"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/></svg>
  </button>
  <button id="fullscreenBtn" title="Full screen" aria-label="Full screen">
    <svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
  </button>
</div>

<script>
// Glowdoodle: paint with light. Each pixel keeps whichever is brighter, the
// camera or what is already there, and the picture fades very slowly.
// Port of https://www.shadertoy.com/view/wlXcW4

const VERT = `#version 300 es
in vec2 p;
out vec2 uv;
void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0., 1.); }`;

// Shadertoy's Buffer A and Buffer B folded into one pass:
// image = brighter of (camera, previous image), fading where the image wins
const PAINT = `#version 300 es
precision highp float;
uniform sampler2D cam, prev;
uniform float fade;
uniform bool mirror, kaleido, zoom, hue, pause, clear;
in vec2 uv;
out vec4 color;
float gray(vec3 rgb) { return dot(rgb, vec3(0.2125, 0.7154, 0.0721)); }
vec3 hueShift(vec3 c, float a) { // rotate around the gray axis
  const vec3 k = vec3(0.57735);
  return c * cos(a) + cross(k, c) * sin(a) + k * dot(k, c) * (1. - cos(a));
}
void main() {
  vec2 pos = vec2(mirror ? 1. - uv.x : uv.x, uv.y);
  if (kaleido) pos = abs(pos * 2. - 1.);
  vec3 c = texture(cam, pos).rgb;

  // Zoom: each frame the image grows a little from the center.
  vec3 i = texture(prev, zoom ? (uv - .5) * .995 + .5 : uv).rgb;
  if (hue) i = hueShift(i, .1);

  vec3 o = gray(c) > gray(i) ? c : i * fade;
  if (pause) o = i;
  if (clear) o = vec3(0.);
  color = vec4(o, 1.);
}`;

const SHOW = `#version 300 es
precision highp float;
uniform sampler2D img;
in vec2 uv;
out vec4 color;
void main() { color = vec4(texture(img, uv).rgb, 1.); }`;

const $ = id => document.getElementById(id);
const msg = $('msg');
const canvas = $('c');
const gl = canvas.getContext('webgl2');

// ---- Settings -------------------------------------------------------------

const settings = { fade: 1 / 3, mirror: true, camera: '', kaleido: false, zoom: false, hue: false, pause: false };
try { Object.assign(settings, JSON.parse(localStorage.glowdoodle)); } catch {}
settings.pause = false; // never start frozen
const save = () => { try { localStorage.glowdoodle = JSON.stringify(settings); } catch {} };

// Slider position -> how much of the image survives each frame.
// 0 never fades; 1/3 is the original's 0.999; 1 is 0.9.
const fadeFactor = () => settings.fade <= 0 ? 1 : 1 - 10 ** (3 * settings.fade - 4);

$('fade').value = settings.fade;
$('fade').oninput = e => { settings.fade = +e.target.value; save(); };
for (const name of ['mirror', 'kaleido', 'zoom', 'hue', 'pause']) {
  $(name).checked = settings[name];
  $(name).onchange = e => { settings[name] = e.target.checked; save(); };
}

// As in the Shadertoy, holding an arrow key turns a variation on for as long
// as it is held, and space clears.
const KEYS = { ArrowUp: 'kaleido', ArrowRight: 'zoom', ArrowLeft: 'hue', ArrowDown: 'pause', ' ': 'clear' };
const held = new Set();
addEventListener('keydown', e => {
  if (!(e.key in KEYS) || e.target.closest('input, select, button')) return;
  e.preventDefault();
  held.add(KEYS[e.key]);
});
addEventListener('keyup', e => held.delete(KEYS[e.key]));
addEventListener('blur', () => held.clear());
const on = name => settings[name] || held.has(name);

// ---- Controls -------------------------------------------------------------

const panel = $('panel'), settingsBtn = $('settingsBtn'), fullscreenBtn = $('fullscreenBtn');

function showPanel(open) {
  panel.hidden = !open;
  settingsBtn.setAttribute('aria-expanded', open);
}
settingsBtn.onclick = () => showPanel(panel.hidden);
addEventListener('keydown', e => { if (e.key === 'Escape') showPanel(false); });

const root = document.documentElement;
const enterFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
if (!enterFullscreen) fullscreenBtn.hidden = true; // e.g. iPhone
fullscreenBtn.onclick = () => {
  if (document.fullscreenElement || document.webkitFullscreenElement) exitFullscreen.call(document);
  else enterFullscreen.call(root);
};

// Dim the controls when the pointer rests, unless the panel is open.
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (panel.hidden) document.body.classList.add('idle'); }, 4000);
}
addEventListener('pointermove', wake);
addEventListener('pointerdown', wake);
addEventListener('keydown', wake);

// Hold on the picture to clear it (or, with the panel open, just close the panel).
let clearing = false;
canvas.addEventListener('pointerdown', () => {
  if (panel.hidden) clearing = true;
  else showPanel(false);
});
addEventListener('pointerup', () => { clearing = false; });
addEventListener('pointercancel', () => { clearing = false; });

// ---- Rendering ------------------------------------------------------------

function program(fragSrc) {
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, fragSrc]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(prog, s);
  }
  gl.bindAttribLocation(prog, 0, 'p');
  gl.linkProgram(prog);
  return prog;
}

function texture(filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

async function start() {
  if (!gl) throw new Error('WebGL2 is not available');

  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;

  // The slow fade needs float buffers: at 8 bits, x * 0.999 rounds back to x.
  // Zoom needs them linearly filtered, which for 32-bit floats is an extension;
  // half floats always filter, but are too coarse for the slowest fades.
  const format = !gl.getExtension('EXT_color_buffer_float') ? [gl.RGBA8, gl.UNSIGNED_BYTE]
    : gl.getExtension('OES_texture_float_linear') ? [gl.RGBA32F, gl.FLOAT]
    : [gl.RGBA16F, gl.HALF_FLOAT];

  const paint = program(PAINT);
  const show = program(SHOW);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const camTex = texture(gl.LINEAR);
  // Two image buffers, ping-ponged: read one, write the other.
  let [read, write] = [0, 1].map(() => ({ tex: texture(gl.LINEAR), fbo: gl.createFramebuffer() }));

  // Size the canvas and both buffers to the camera, starting from black.
  function resize(w, h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    for (const { tex, fbo } of [read, write]) {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, format[0], w, h, 0, gl.RGBA, format[1], null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
  }

  async function useCamera(deviceId) {
    const constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : true };
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch (e) {
      if (!deviceId) throw e;
      stream = await navigator.mediaDevices.getUserMedia({ video: true }); // remembered camera is gone
    }
    video.srcObject?.getTracks().forEach(t => t.stop());
    video.srcObject = stream;
    await video.play();
    if (video.videoWidth !== canvas.width || video.videoHeight !== canvas.height) {
      resize(video.videoWidth, video.videoHeight);
    }
    return stream.getVideoTracks()[0].getSettings().deviceId;
  }

  const current = await useCamera(settings.camera);

  // Offer a camera choice only when there is one to make.
  const cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  if (cameras.length > 1) {
    const select = $('camera');
    cameras.forEach((d, i) => select.add(new Option(d.label || `Camera ${i + 1}`, d.deviceId)));
    select.value = current;
    select.onchange = async () => {
      settings.camera = select.value;
      save();
      try { await useCamera(select.value); } catch (e) { msg.textContent = e.message; }
    };
    $('cameraRow').hidden = false;
  }

  gl.useProgram(paint);
  gl.uniform1i(gl.getUniformLocation(paint, 'cam'), 0);
  gl.uniform1i(gl.getUniformLocation(paint, 'prev'), 1);
  const loc = {};
  for (const name of ['fade', 'mirror', 'kaleido', 'zoom', 'hue', 'pause', 'clear']) loc[name] = gl.getUniformLocation(paint, name);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  msg.textContent = 'click or press space to clear';
  setTimeout(() => { msg.textContent = ''; }, 4000);
  wake();

  function frame() {
    requestAnimationFrame(frame);
    if (video.readyState < 2) return; // between cameras

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, read.tex);

    gl.useProgram(paint);
    gl.uniform1f(loc.fade, fadeFactor());
    for (const name of ['mirror', 'kaleido', 'zoom', 'hue', 'pause']) gl.uniform1i(loc[name], on(name));
    gl.uniform1i(loc.clear, clearing || held.has('clear'));
    gl.bindFramebuffer(gl.FRAMEBUFFER, write.fbo);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.useProgram(show); // sampler defaults to unit 0
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, write.tex);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    [read, write] = [write, read];
  }
  frame();
}

start().catch(e => { msg.textContent = e.name === 'NotAllowedError' ? 'Glowdoodle needs camera access' : e.message; });
</script>
</body>
</html>
