name: Capture ericrosenbaum.com look

# One-off: screenshots the live Squarespace site and saves its CSS and
# computed styles into scrape/look/, so the redesign can match it.

on:
  push:
    branches: [claude/personal-website-design-74h65r]
    paths: ['.github/workflows/capture-look.yml', 'tools/capture_look.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Screenshot and record styles
        run: node tools/capture_look.mjs
      - name: Save site CSS
        run: |
          grep -oh 'https://[^"]*site\.css[^"]*' scrape/html/www.ericrosenbaum.com/index.html | head -1 > /tmp/css-url
          curl -sSL "$(cat /tmp/css-url)" -o scrape/look/site.css || true
          ls -la scrape/look
      - name: Commit scrape/look/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrape/look
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Capture ericrosenbaum.com screenshots and styles into scrape/look/"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep $((i * 3))
            git pull -q --rebase origin ${GITHUB_REF_NAME}
          done
          exit 1
