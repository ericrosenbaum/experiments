name: Deploy

# Publishes this branch to https://ericrosenbaum.github.io/experiments/spectrogram/
# via the shared workflow on main (see main's README).

on:
  push:
    branches: [spectrogram]
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
    uses: ericrosenbaum/experiments/.github/workflows/publish-experiment.yml@main
    with:
      name: spectrogram
