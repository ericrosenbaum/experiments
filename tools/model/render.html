<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}canvas{display:block}</style></head>
<body>
<script type="module">
// Renders one library model on a plain floor, for comparing against photos
// of the real build (tools/model/review.mjs drives this).
// ?id=skyship  the model
// ?az=90&el=25&fov=30&dist=40&w=640&h=387&tx=0&ty=2&tz=0
//   camera azimuth (0 = in front, 90 = on its left side, looking right),
//   elevation and field of view in degrees, distance and target
import * as THREE from 'three';
import RAPIER from '@dimforge/rapier3d-compat';
import { World } from '/src/world/world.js';
import { LIBRARY_BY_ID, modelBottom } from '/src/world/library.js';

await RAPIER.init();
const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
const W = num('w', 640), H = num('h', 387);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6e6e3);
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a968c, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(10, 30, 14);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
Object.assign(key.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 80 });
scene.add(key);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xe2e2df }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.01; // over the world's own ground
floor.receiveShadow = true;
scene.add(floor);

const world = new World(RAPIER, scene);
const def = LIBRARY_BY_ID[q.get('id') ?? 'skyship'];
world.addModel(def, { x: 0, z: 0, y: -modelBottom(def) });
world.paused = true;
world.step(0); // places the meshes

const DEG = Math.PI / 180;
const az = num('az', 90) * DEG, el = num('el', 25) * DEG, dist = num('dist', 40);
const target = new THREE.Vector3(num('tx', 0), num('ty', 2), num('tz', 0));
const camera = new THREE.PerspectiveCamera(num('fov', 30), W / H, 0.1, 500);
camera.position.copy(target).add(new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(dist));
camera.lookAt(target);
renderer.render(scene, camera);
window.done = true;
</script>
</body></html>
